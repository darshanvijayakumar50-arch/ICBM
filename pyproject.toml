[project]
name = "icbm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pragadheesh A", email = "pragadheeshanand@gmail.com" },
    { name = "Darshan V", email = "darshanvijayakumar50@gmail.com"},
    { name = "Arthi Y", email = "aryuva2009@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "evo>=1.38.1",
    "jsbsim>=1.3.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "psutil>=7.2.2",
]

[project.scripts]
icbm = "icbm:main"
evaluate = "icbm.evaluate:main"
degrade = "ext.degrade:main"
simulate = "icbm.simulate:main"
performance = "icbm.perf:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
